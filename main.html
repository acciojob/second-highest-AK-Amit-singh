<body>	
	<script>
		function secondHighest(arr) {
			//Write your code here
			if(arr.length <= 1){
				return -Infinity;
			}
			
			let first = -Infinity;
			let second = -Infinity;
	
			for(let i =0;i<arr.length; i++){
				let num = Number(arr[i]);
				if(num > first){
					second= first;
					first = num;
					
				}else if(num > second && num !== first){
					second = num;
				}
			} 	
			return second;
		}

	</script>

    <script type="text/javascript" src="./script.js">
</script>

</body>
