	<script>
		function secondHighest(arr) {
    if (arr.length <= 1) {
        return -Infinity;
    }
	let same = true;
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] !== arr[0]) {
            same = false;
            break;
        }
    }

    if (same) {
        return -Infinity;
    }

    let first = -Infinity;
    let second = -Infinity;

    for (let i = 0; i < arr.length; i++) {
        if (arr[i] > first) {
            second = first;
            first = arr[i];
        } else if (arr[i] < first && arr[i] > second) {
            second = arr[i];
        }
    }

    return second;
}


</script>
